# Culinary Blog – Development stack (SRS §6.5)
# 8 services: nginx, api, frontend, postgres, redis, minio, hangfire, seq  (+ mailhog: profile "dev")
# Chạy:   cp .env.example .env  &&  docker compose --profile dev up -d --build

name: culinaryblog

x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  # GSS Encryption Mode=Disable: không dùng Kerberos, tránh Npgsql tìm libgssapi_krb5 (không có trong image aspnet)
  ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
  ConnectionStrings__Redis: redis:6379
  Jwt__SigningKey: ${JWT_SIGNING_KEY}
  Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
  Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
  MinIO__Endpoint: http://minio:9000
  MinIO__PublicBaseUrl: ${MINIO_PUBLIC_URL}/culinary-blog
  MinIO__AccessKey: ${MINIO_ROOT_USER}
  MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
  MinIO__BucketName: culinary-blog
  Smtp__Host: ${SMTP_HOST:-mailhog}
  Smtp__Port: ${SMTP_PORT:-1025}
  Smtp__UseSsl: ${SMTP_USE_SSL:-false}
  Seq__ServerUrl: http://seq:80
  OpenTelemetry__OtlpEndpoint: http://seq:80/ingest/otlp
  Cors__AllowedOrigins__0: ${SITE_URL:-http://localhost:3000}
  Smtp__SiteUrl: ${SITE_URL:-http://localhost:3000}

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    environment:
      # nginx.conf.template → envsubst → /etc/nginx/nginx.conf lúc khởi động (FR-JOB-001 / MT-39).
      # FILTER giới hạn phạm vi thay thế ở các biến HANGFIRE_*, giữ nguyên biến của Nginx ($host, $remote_addr…).
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: "^HANGFIRE_"
      HANGFIRE_GATE_SECRET: ${HANGFIRE_GATE_SECRET}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      # Sinh trước khi "docker compose up": ./nginx/generate-htpasswd.sh (hoặc .ps1). KHÔNG commit (NFR-SEC-007).
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      # FR-OBS-001: chỉ nhận traffic khi API đã sẵn sàng (/health/ready trả 200), không chỉ "container đã chạy"
      api: { condition: service_healthy }
      frontend: { condition: service_started }
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: culinaryblog-api
    ports:
      - "5000:8080"
    environment:
      <<: *api-env
      Hangfire__WorkerOnly: "false"
      # Job do container "hangfire" xử lý; API chỉ enqueue
      Hangfire__ServerEnabled: "false"
      # Lớp bảo vệ thứ hai của Dashboard: chỉ request mang header X-Hangfire-Gate khớp secret mới vào được
      Hangfire__DashboardGateSecret: ${HANGFIRE_GATE_SECRET}
      Database__MigrateOnStartup: "true"
      Seed__Enabled: "true"
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      Seed__AuthorPassword: ${SEED_AUTHOR_PASSWORD}
    volumes:
      - dpkeys:/home/app/dpkeys
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      # FR-OBS-001 / NFR-REL-001: readiness = PostgreSQL + Redis (tag "ready"). Lỗi → container "unhealthy": Nginx ngừng
      # chuyển traffic tới nó nhưng Docker KHÔNG khởi động lại (lỗi nằm ở phụ thuộc, không ở process API).
      # curl được cài ở stage runtime của backend/Dockerfile (aspnet:10.0 không có sẵn).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Hangfire worker: cùng image API, chỉ chạy BackgroundJobServer (SRS §3.6, NFR-SCALE-001)
  hangfire:
    image: culinaryblog-api
    environment:
      <<: *api-env
      Hangfire__WorkerOnly: "true"
    volumes:
      - dpkeys:/home/app/dpkeys
    depends_on:
      api: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    image: culinaryblog-web
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_BASE_URL: http://api:8080/api/v1
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${GOOGLE_CLIENT_ID}
      AUTH_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET}
      AUTH_TRUST_HOST: "true"
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    depends_on:
      - api
    healthcheck:
      # node:22-alpine không có curl — dùng wget của busybox (SRS v1.2.0 §6.5 — MT-51)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # -h 127.0.0.1: kiểm tra qua TCP; lúc chạy init.sql Postgres chỉ mở unix socket nên chưa được coi là healthy
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    # quay.io + tag ghim: repository "minio/minio" trên Docker Hub đã bị gỡ (pull trả "pull access denied
    # ... repository does not exist"), nên "minio/minio:latest" không còn kéo được trên máy mới.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seqdata:/data
    restart: unless-stopped

  # Dev only – SMTP test cho FR-JOB-001 (UI :8025)
  mailhog:
    image: mailhog/mailhog
    profiles: ["dev"]
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  seqdata:
  dpkeys:
